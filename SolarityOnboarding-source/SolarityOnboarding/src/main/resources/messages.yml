# SolarityOnboarding messages.yml
# MiniMessage text. %prefix% is replaced with `prefix`. An empty message is not sent.

prefix: "<gold><bold>Solarity</bold></gold> <dark_gray>»</dark_gray> "

no-permission: "%prefix%<red>You don't have permission to do that."
players-only: "%prefix%<red>Only players can do that."
reloaded: "%prefix%<green>SolarityOnboarding reloaded. <gray>%guides% guide(s) loaded."
unknown-player: "%prefix%<red>No player called <white>%player%</white> has played here."
unknown-guide: "%prefix%<red>No guide called <white>%guide%</white>. <gray>/onboard npc list"

onboarding-disabled: "%prefix%<red>Onboarding is turned off right now."
already-onboarded: "%prefix%<gray>You've already been onboarded. <white>/gens home</white> takes you to your claim."
start-command-disabled: "%prefix%<gray>Find the guide at spawn to get started."
in-progress: ""
onboarding-failed: "%prefix%<red>Something went wrong setting up your claim. Staff have been told; click the guide again in a moment."
onboarding-done: ""

status-done: "%prefix%<white>%player%</white> <green>onboarded</green> <gray>on %date% (%source%)."
status-not-done: "%prefix%<white>%player%</white> <yellow>hasn't onboarded yet."
reset-done: "%prefix%<green>Reset onboarding for <white>%player%</white>. <gray>Their claim and gens are untouched; use /gens admin reset to clear those too."
complete-done: "%prefix%<green>Marked <white>%player%</white> as onboarded."
wipe-confirm: "%prefix%<yellow>This resets onboarding for <white>every</white> player. Run <white>/onboard wipe confirm</white> within 30 seconds."
wipe-done: "%prefix%<green>Onboarding wiped for %count% player(s)."
started-for: "%prefix%<green>Started onboarding for <white>%player%</white>."

npc-created: "%prefix%<green>Created %role% guide <white>%guide%</white>."
npc-exists: "%prefix%<red>A guide called <white>%guide%</white> already exists."
npc-bad-id: "%prefix%<red>Guide names use a-z, 0-9, _ and -."
npc-bad-role: "%prefix%<red>Role must be <white>onboarding</white> or <white>info</white>."
npc-moved: "%prefix%<green>Moved <white>%guide%</white>."
npc-removed: "%prefix%<green>Removed <white>%guide%</white>."
npc-renamed: "%prefix%<green>Renamed <white>%guide%</white>."
npc-description: "%prefix%<green>Set the description of <white>%guide%</white>."
npc-teleported: "%prefix%<green>Teleported to <white>%guide%</white>."
npc-list-header: "%prefix%<white>Guides (%count%):"
npc-list-entry: "<dark_gray> - </dark_gray><white>%guide%</white> <gray>%role% · %world% %x% %y% %z% · skin: %skin%</gray>"
npc-list-empty: "%prefix%<gray>No guides yet. <white>/onboard npc create <name> onboarding</white>"
npc-lines-header: "%prefix%<white>Lines of %guide%:"
npc-lines-entry: "<dark_gray> %index%.</dark_gray> %line%"
npc-lines-empty: "%prefix%<gray>%guide% has no lines of its own%fallback%."
npc-lines-added: "%prefix%<green>Added line %index% to <white>%guide%</white>."
npc-lines-removed: "%prefix%<green>Removed line %index% from <white>%guide%</white>."
npc-lines-cleared: "%prefix%<green>Cleared the lines of <white>%guide%</white>."
npc-lines-bad-index: "%prefix%<red>No line %index%."
npc-guidance: "%prefix%<green>Guidance for <white>%guide%</white> is now <white>%state%</white>."
npc-actions-header: "%prefix%<white>Click actions of %guide%:"
npc-actions-added: "%prefix%<green>Added action %index% to <white>%guide%</white>."
npc-actions-removed: "%prefix%<green>Removed action %index% from <white>%guide%</white>."
npc-actions-cleared: "%prefix%<green>Cleared the actions of <white>%guide%</white>."

skin-working: "%prefix%<gray>Getting that skin...</gray>"
skin-set: "%prefix%<green>Skin of <white>%guide%</white> set <gray>(%skin%)</gray>."
skin-failed: "%prefix%<red>Couldn't get that skin: <white>%reason%"
skin-cleared: "%prefix%<green>Skin of <white>%guide%</white> reset to the default."
